---
- name: Reproduce Machine System State & Configurations
  hosts: local
  connection: local
  gather_facts: yes

  vars_files:
    - vars/main.yml

  roles:
    - role: system_packages
      tags: [packages, system]
    - role: flatpaks
      tags: [flatpak, apps]
    - role: services
      tags: [services, systemd]
    - role: user_tools
      tags: [tools, bin]
    - role: dotfiles
      tags: [dotfiles, config, konsole]

  post_tasks:
    - name: Verification Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " System Reproduction Complete!"
          - " Curated APT Packages & Third-Party Repos: Installed"
          - " Flatpaks: Configured & Installed"
          - " System Services (Tailscale/Syncthing): Enabled"
          - " CLI Tools (yt-dlp, deno): Deployed in ~/.local/bin"
          - " Konsole Settings & Profiles: Restored"
          - " KDE Plasma Settings & Shortcuts: Restored"
          - "=========================================================="
