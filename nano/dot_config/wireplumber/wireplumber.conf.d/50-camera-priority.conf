monitor.v4l2.rules = [
  {
    matches = [
      {
        # Prioritize any external USB webcam (V4L2 capture source)
        node.name = "~v4l2_input.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [
      {
        # Internal IPU6 / ov2740 libcamera source (fallback when no external webcam is connected)
        node.name = "~libcamera_input.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 700
        priority.session = 700
      }
    }
  }
]
