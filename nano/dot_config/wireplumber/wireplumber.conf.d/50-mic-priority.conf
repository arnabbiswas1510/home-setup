monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic2__source"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2500
        priority.session = 2500
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.usb-DisplayLink_ThinkPad_Hybrid_USB-C.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 500
        priority.session = 500
      }
    }
  }
]
