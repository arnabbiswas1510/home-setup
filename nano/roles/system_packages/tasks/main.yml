---
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Install prerequisite packages for repositories
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - curl
    - gpg
    - ca-certificates
    - apt-transport-https
  become: true

# --- Google Chrome Repo ---
- name: Download Google Chrome GPG key
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google-chrome.gpg
    mode: '0644'
  become: true

- name: Add Google Chrome APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main"
    state: present
    filename: google-chrome
  become: true

# --- Sublime Text Repo ---
- name: Download Sublime Text GPG key
  ansible.builtin.get_url:
    url: https://download.sublimetext.com/sublimehq-pub.gpg
    dest: /etc/apt/keyrings/sublime-text.gpg
    mode: '0644'
  become: true

- name: Add Sublime Text APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/sublime-text.gpg] https://download.sublimetext.com/ apt/stable/"
    state: present
    filename: sublime-text
  become: true

# --- Tailscale Repo ---
- name: Add Tailscale GPG key and repository
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg | tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
    curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list | tee /etc/apt/sources.list.d/tailscale.list
  args:
    creates: /etc/apt/sources.list.d/tailscale.list
  become: true

# --- Syncthing Repo ---
- name: Download Syncthing GPG key
  ansible.builtin.get_url:
    url: https://syncthing.net/release-key.gpg
    dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    mode: '0644'
  become: true

- name: Add Syncthing APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable"
    state: present
    filename: syncthing
  become: true

# --- Package Installation ---
- name: Update APT cache and install core curated packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: yes
  become: true

- name: Install third-party packages (Chrome, Sublime, Tailscale, Syncthing)
  ansible.builtin.apt:
    name: "{{ third_party_packages }}"
    state: present
  become: true
