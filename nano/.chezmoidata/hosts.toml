# Machine instance definitions for chezmoi

[hosts.nano]
name = "Nano"
description = "Debian 13 Workstation"
apt_prereqs = ["curl", "gpg", "ca-certificates", "apt-transport-https"]

repos = [
  { name = "google-chrome", key_url = "https://dl.google.com/linux/linux_signing_key.pub", keyring = "/etc/apt/keyrings/google-chrome.gpg", repo = "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" },
  { name = "sublime-text", key_url = "https://download.sublimetext.com/sublimehq-pub.gpg", keyring = "/etc/apt/keyrings/sublime-text.gpg", repo = "deb [signed-by=/etc/apt/keyrings/sublime-text.gpg] https://download.sublimetext.com/ apt/stable/" },
  { name = "syncthing", key_url = "https://syncthing.net/release-key.gpg", keyring = "/etc/apt/keyrings/syncthing-archive-keyring.gpg", repo = "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable" }
]

apt_packages = [
  "build-essential",
  "curl",
  "wget",
  "git",
  "zsh",
  "lsof",
  "rclone",
  "snapper",
  "btrfs-progs",
  "wl-clipboard",
  "qimgv",
  "feh",
  "flatpak",
  "dkms",
  "ca-certificates",
  "gpg",
  "apt-transport-https",
  "plasma-wallpapers-addons",
  "google-chrome-stable",
  "sublime-text",
  "tailscale",
  "syncthing"
]

flatpak_apps = [
  "com.github.dynobo.normcap",
  "com.github.johnfactotum.Foliate",
  "com.ktechpit.whatsie",
  "com.logseq.Logseq",
  "com.rcloneui.RcloneUI",
  "info.smplayer.SMPlayer",
  "io.mpv.Mpv",
  "org.avidemux.Avidemux",
  "org.jellyfin.JellyfinDesktop",
  "org.kde.falkon",
  "org.videolan.VLC",
  "tv.plex.PlexDesktop",
  "us.zoom.Zoom"
]

system_services = [
  "tailscale",
  "syncthing"
]

user_services = [
  "syncthing"
]

[hosts.dietpi]
name = "DietPi"
description = "Headless Server"
apt_prereqs = ["curl", "gpg", "ca-certificates"]
repos = []
apt_packages = [
  "curl",
  "wget",
  "git",
  "zsh",
  "lsof",
  "rclone",
  "tailscale"
]
flatpak_apps = [
  "com.github.dynobo.normcap",
  "com.github.johnfactotum.Foliate",
  "com.ktechpit.whatsie",
  "com.logseq.Logseq",
  "com.rcloneui.RcloneUI",
  "info.smplayer.SMPlayer",
  "io.mpv.Mpv",
  "org.avidemux.Avidemux",
  "org.jellyfin.JellyfinDesktop",
  "org.kde.falkon",
  "org.videolan.VLC",
  "tv.plex.PlexDesktop",
  "us.zoom.Zoom"
]
system_services = [
  "tailscale"
]
user_services = []
