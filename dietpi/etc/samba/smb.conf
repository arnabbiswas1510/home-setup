[global]
   workgroup = WORKGROUP
   server string = Samba Server
   security = user
   map to guest = Never

   # Compatibility with modern Windows / clients
   server min protocol = SMB2
   server max protocol = SMB3

   # Disable printing
   load printers = no
   disable spoolss = yes
   printing = bsd
   printcap name = /dev/null

#============================ Share Definitions ==============================

[pom]
   comment = Pom Home Directory
   path = /home/pom
   read only = no
   browsable = yes
   valid users = pom
   create mask = 0664
   directory mask = 0775

